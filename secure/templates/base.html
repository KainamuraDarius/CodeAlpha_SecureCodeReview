<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MediTrack</title></head>
<body>
<nav>
  <a href="{{ url_for('index') }}">Home</a> |
  <a href="{{ url_for('search') }}">Medicines</a> |
  {% if g.user %}
    <a href="{{ url_for('messages') }}">Contact pharmacist</a> |
    <form method="post" action="{{ url_for('logout') }}" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button>Logout ({{ g.user.username }})</button>
    </form>
  {% else %}
    <a href="{{ url_for('login') }}">Login</a>
  {% endif %}
</nav>
<hr>
{% block content %}{% endblock %}
</body>
</html>
