{% extends "base.html" %}
{% block content %}
<h2>Message the pharmacist</h2>
{% if sent %}<p>Message sent.</p>{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <textarea name="body" maxlength="2000" required></textarea>
  <button>Send</button>
</form>
{% endblock %}
