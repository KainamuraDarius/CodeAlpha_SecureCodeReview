{% extends "base.html" %}
{% block title %}Contact pharmacist{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Message the pharmacist</h2>
  <p class="muted">A licensed pharmacist will reply within one working day.</p>
  {% if sent %}<div class="alert alert-success">Message sent. We'll get back to you soon.</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="body">Your message</label>
      <textarea id="body" name="body" maxlength="2000" required></textarea></div>
    <button>Send message</button>
  </form>
</div>
{% endblock %}
