{% extends "base.html" %}
{% block title %}Prescription #{{ p.id }}{% endblock %}
{% block content %}
<div class="pagehead">
  <a href="{{ url_for('index') }}">← Back to dashboard</a>
</div>
<div class="card">
  <span class="badge">Active</span>
  <h2>Prescription #{{ p.id }}</h2>
  <dl class="rx">
    <dt>Medicine</dt><dd><b>{{ p.drug }}</b></dd>
    <dt>Dosage</dt><dd>{{ p.dosage }}</dd>
    <dt>Patient notes</dt><dd>{{ p.notes }}</dd>
  </dl>
</div>
{% endblock %}
