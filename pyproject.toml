[project]
name = "meditrack-secure-code-review"
version = "1.0.0"
description = "CodeAlpha Task 3: secure code review of a small Flask app, with fixes and exploit tests"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
